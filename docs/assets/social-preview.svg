<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Outer frame -->
  <rect x="28" y="28" width="1224" height="584" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Top badge -->
  <rect x="76" y="72" width="330" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="98" cy="90" r="5" fill="#22c55e"/>
  <text x="114" y="95" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="0.4">APPLE SILICON · MACOS 15–27 · OPEN SOURCE</text>

  <!-- Emblem + Title -->
  <rect x="76" y="136" width="84" height="84" rx="22" fill="url(#iconGrad)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <path d="M100 156 h18 c18 0 28 9 28 22 s-10 22 -28 22 h-18 z M111 166 v24 h7 c10 0 16 -4.5 16 -12 s-6 -12 -16 -12 z" fill="#ffffff"/>

  <text x="184" y="190" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">DirectMetal</text>
  <rect x="184" y="206" width="220" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Tagline -->
  <text x="76" y="274" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="28" font-weight="500">
    Run Windows DirectX 9 / 10 / 11 / 12 games natively on Apple Silicon.
  </text>
  <text x="76" y="312" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="21" font-weight="400">
    No bottles · No Rosetta 2 · Direct-to-Metal 3/4 (FL 12_2) · Native SwiftUI Launcher
  </text>

  <!-- 4 Stat Cards -->
  <!-- Card 1 -->
  <rect x="76" y="366" width="268" height="148" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.30" stroke-width="1.2"/>
  <text x="100" y="402" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">PIXEL CONFORMANCE</text>
  <text x="100" y="454" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="40" font-weight="800">25 / 25</text>
  <text x="100" y="488" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14">SSIM 0.9998 vs. RTX 3070</text>

  <!-- Card 2 -->
  <rect x="364" y="366" width="268" height="148" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.30" stroke-width="1.2"/>
  <text x="388" y="402" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">D3D12 FL 12_2 (M4)</text>
  <text x="388" y="454" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="40" font-weight="800">4,490 FPS</text>
  <text x="388" y="488" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14">2,092 FPS Deferred PBR · 254× cache</text>

  <!-- Card 3 -->
  <rect x="652" y="366" width="268" height="148" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#22c55e" stroke-opacity="0.30" stroke-width="1.2"/>
  <text x="676" y="402" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">LITE INSTALLER</text>
  <text x="676" y="454" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="40" font-weight="800">2.8 MiB</text>
  <text x="676" y="488" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14">SHA-256 + codesign verified updater</text>

  <!-- Card 4 -->
  <rect x="940" y="366" width="264" height="148" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-opacity="0.30" stroke-width="1.2"/>
  <text x="964" y="402" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">WARM LAUNCH</text>
  <text x="964" y="454" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="40" font-weight="800">70 ms</text>
  <text x="964" y="488" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14">0.25 ms APFS CoW · ARM64EC + FEX</text>

  <!-- Footer Strip -->
  <text x="76" y="568" fill="#64748b" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16">github.com/amoham42/DirectMetal</text>
  <text x="1204" y="568" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15">Steam · GOG · Epic · MetalFX · Seatbelt Sandbox · Secure Enclave</text>
</svg>
