<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="DirectMetal Apple Silicon Benchmarks: M1 Pro vs Apple M4">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131924"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="m4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ros" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="880" height="340" rx="14" fill="url(#bg)" stroke="#263042" stroke-width="1.2"/>

  <!-- Header -->
  <text x="28" y="38" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700">DirectMetal v1.0.1 — Apple Silicon Benchmarks</text>
  <text x="28" y="57" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5">ARM64EC + FEX · Ultra + Warm Pool · 25/25 conformance vs. Windows 11 + NVIDIA RTX 3070 (SSIM 0.999841–0.999844)</text>

  <!-- Legend -->
  <circle cx="628" cy="34" r="5" fill="#38bdf8"/>
  <text x="639" y="38" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5" font-weight="600">M1 Pro (Apple7)</text>
  <circle cx="754" cy="34" r="5" fill="#34d399"/>
  <text x="765" y="38" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5" font-weight="600">M4 (Apple9)</text>

  <!-- Divider -->
  <line x1="28" y1="72" x2="852" y2="72" stroke="#1e293b" stroke-width="1"/>

  <!-- LEFT PANEL: Throughput (FPS) -->
  <text x="28" y="98" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">Peak DirectX → Metal Throughput (Higher is Better)</text>

  <!-- D3D12 Bench -->
  <text x="28" y="126" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5" font-weight="600">D3D12 FL 12_2 Bench</text>
  <text x="415" y="126" text-anchor="end" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">M4 +66.7%</text>
  <rect x="28" y="134" width="387" height="12" rx="6" fill="#1e293b"/>
  <rect x="28" y="134" width="210" height="12" rx="6" fill="url(#m1)"/>
  <text x="246" y="144" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600">2,694 FPS</text>
  <rect x="28" y="150" width="387" height="12" rx="6" fill="#1e293b"/>
  <rect x="28" y="150" width="350" height="12" rx="6" fill="url(#m4)"/>
  <text x="370" y="160" text-anchor="end" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700">4,490 FPS</text>

  <!-- D3D11 Bench -->
  <text x="28" y="188" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5" font-weight="600">D3D11 Bench</text>
  <text x="415" y="188" text-anchor="end" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">4,090 / 3,956 FPS</text>
  <rect x="28" y="196" width="387" height="12" rx="6" fill="#1e293b"/>
  <rect x="28" y="196" width="319" height="12" rx="6" fill="url(#m1)"/>
  <text x="340" y="206" text-anchor="end" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700">4,090 FPS</text>
  <rect x="28" y="212" width="387" height="12" rx="6" fill="#1e293b"/>
  <rect x="28" y="212" width="308" height="12" rx="6" fill="url(#m4)"/>
  <text x="329" y="222" text-anchor="end" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700">3,956 FPS</text>

  <!-- Deferred PBR -->
  <text x="28" y="250" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5" font-weight="600">Deferred PBR SM 6.0 (1024×1024)</text>
  <text x="415" y="250" text-anchor="end" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">M4 +33.4%</text>
  <rect x="28" y="258" width="387" height="12" rx="6" fill="#1e293b"/>
  <rect x="28" y="258" width="122" height="12" rx="6" fill="url(#m1)"/>
  <text x="158" y="268" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600">1,569 FPS (1,321 1%-low)</text>
  <rect x="28" y="274" width="387" height="12" rx="6" fill="#1e293b"/>
  <rect x="28" y="274" width="163" height="12" rx="6" fill="url(#m4)"/>
  <text x="199" y="284" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600">2,092 FPS (1,435 1%-low)</text>

  <!-- Vertical divider -->
  <line x1="444" y1="88" x2="444" y2="316" stroke="#1e293b" stroke-width="1"/>

  <!-- RIGHT PANEL: Startup & Size Wins -->
  <text x="468" y="98" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">Launch Latency &amp; Footprint (Lower is Better)</text>

  <!-- Launch Latency -->
  <text x="468" y="126" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5" font-weight="600">Win32 Process Launch (Cold vs. Warm Pool)</text>
  <text x="852" y="126" text-anchor="end" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">10.7× faster</text>
  <rect x="468" y="134" width="384" height="12" rx="6" fill="#1e293b"/>
  <rect x="468" y="134" width="320" height="12" rx="6" fill="url(#ros)"/>
  <text x="795" y="144" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">1,077 ms</text>
  <rect x="468" y="150" width="384" height="12" rx="6" fill="#1e293b"/>
  <rect x="468" y="150" width="30" height="12" rx="6" fill="url(#m4)"/>
  <text x="506" y="160" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700">70–100 ms (warm wineserver pool)</text>

  <!-- Full Suite Wall Time -->
  <text x="468" y="188" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5" font-weight="600">Deferred PBR Suite Wall Time (6/6 + 150f)</text>
  <text x="852" y="188" text-anchor="end" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">4.2× faster</text>
  <rect x="468" y="196" width="384" height="12" rx="6" fill="#1e293b"/>
  <rect x="468" y="196" width="320" height="12" rx="6" fill="url(#ros)"/>
  <text x="795" y="206" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">1.84 s</text>
  <rect x="468" y="212" width="384" height="12" rx="6" fill="#1e293b"/>
  <rect x="468" y="212" width="75" height="12" rx="6" fill="url(#m4)"/>
  <text x="551" y="222" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700">0.433 s on M4 (0.665 s on M1 Pro)</text>

  <!-- Bundle Size -->
  <text x="468" y="250" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5" font-weight="600">App Bundle Size (Dual-Runtime → Offline → Lite)</text>
  <text x="852" y="250" text-anchor="end" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">-99.96%</text>
  <rect x="468" y="258" width="384" height="12" rx="6" fill="#1e293b"/>
  <rect x="468" y="258" width="320" height="12" rx="6" fill="url(#ros)"/>
  <text x="795" y="268" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">7.50 GB</text>
  <rect x="468" y="274" width="384" height="12" rx="6" fill="#1e293b"/>
  <rect x="468" y="274" width="158" height="12" rx="6" fill="url(#m1)"/>
  <text x="634" y="284" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600">3.70 GB Offline (1.0 GB ULMO DMG)</text>
  <rect x="468" y="290" width="384" height="12" rx="6" fill="#1e293b"/>
  <rect x="468" y="290" width="8" height="12" rx="4" fill="url(#m4)"/>
  <text x="484" y="300" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="700">2.9 MB DirectMetal-Lite (2.8 MiB DMG)</text>

  <!-- Footer -->
  <text x="28" y="324" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5">Measured on Apple M1 Pro (macOS 27.2.1) &amp; Apple M4 (macOS 26.7.1) · APFS CoW prefix clone: 0.25–0.41 ms · BinaryArchive warm load: 67×–254×</text>
</svg>
