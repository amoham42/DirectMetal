# DirectMetal unified runtime configuration for Mullion (D3D10/11/12 -> Metal 3/4)

# Match Direct3D NaN texture sampling behavior (coordinate zero)
d3d11.sampleNaNToZero = True

# Keep standard D3D11 Map(DO_NOT_WAIT) semantics
d3d11.ignoreMapFlagNoWait = False

# Preserve native macOS window switching
dxgi.handleAltTab = False
dxgi.forceSDR = False
