name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    name: Build, Sign & Publish DirectMetal-Lite DMG
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag & checkout target ref
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-${REF_NAME}}"
          if [[ -z "${TAG}" || "${TAG}" != v* ]]; then
            echo "error: release tag must start with 'v' (got '${TAG}')" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git checkout --detach "refs/tags/${TAG}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Cache llvm-mingw cross-toolchain
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: .directmetal_cache/toolchains/llvm-mingw
          key: llvm-mingw-ucrt-macos-universal-20241119

      - name: Install llvm-mingw (for d3d12_x64.dll Placed-Resource Guard)
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOLCHAIN_DIR=".directmetal_cache/toolchains/llvm-mingw"
          ARCHIVE_PATH="${RUNNER_TEMP}/llvm-mingw-ucrt-macos-universal.tar.xz"
          FALLBACK_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20241119/llvm-mingw-20241119-ucrt-macos-universal.tar.xz"

          MINGW_URL="$(gh api repos/mstorsjo/llvm-mingw/releases/latest \
            --jq '.assets[] | select(.name | test("^llvm-mingw-[0-9]+-ucrt-macos-universal\\.tar\\.xz$")) | .browser_download_url' \
            2>/dev/null | head -n 1 || true)"
          if [[ -z "${MINGW_URL}" ]]; then
            MINGW_URL="${FALLBACK_URL}"
          fi

          echo "[Release] Downloading llvm-mingw from ${MINGW_URL}..."
          curl -fsSL --retry 3 -o "${ARCHIVE_PATH}" "${MINGW_URL}"
          rm -rf "${TOOLCHAIN_DIR}"
          mkdir -p "${TOOLCHAIN_DIR}"
          tar -xJf "${ARCHIVE_PATH}" --strip-components=1 -C "${TOOLCHAIN_DIR}"
          rm -f "${ARCHIVE_PATH}"
          "${TOOLCHAIN_DIR}/bin/x86_64-w64-mingw32-clang" --version | head -n 1

      - name: Configure optional Apple Developer ID signing & Notarytool
        id: signing
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -n "${APPLE_SIGN_IDENTITY}" && -n "${APPLE_CERT_P12_BASE64}" && -n "${APPLE_CERT_PASSWORD}" ]]; then
            echo "[Release] Configuring ephemeral keychain for Developer ID signing..."
            KEYCHAIN_PATH="${RUNNER_TEMP}/directmetal-release.keychain-db"
            KEYCHAIN_PWD="$(uuidgen)"
            CERT_PATH="${RUNNER_TEMP}/developer-id.p12"

            printf '%s' "${APPLE_CERT_P12_BASE64}" | base64 --decode > "${CERT_PATH}"
            security create-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN_PATH}"

            EXISTING_KEYCHAINS=()
            while IFS= read -r line; do
              cleaned="$(printf '%s' "${line}" | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')"
              [[ -n "${cleaned}" ]] && EXISTING_KEYCHAINS+=("${cleaned}")
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "${KEYCHAIN_PATH}" "${EXISTING_KEYCHAINS[@]}"
            security default-keychain -d user -s "${KEYCHAIN_PATH}"

            security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${APPLE_CERT_PASSWORD}" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PWD}" "${KEYCHAIN_PATH}"
            rm -f "${CERT_PATH}"

            echo "keychain_path=${KEYCHAIN_PATH}" >> "${GITHUB_OUTPUT}"
            echo "signed=true" >> "${GITHUB_OUTPUT}"

            if [[ -n "${APPLE_ID}" && -n "${APPLE_TEAM_ID}" && -n "${APPLE_APP_SPECIFIC_PASSWORD}" ]]; then
              echo "[Release] Storing Notarytool credentials in ephemeral keychain..."
              xcrun notarytool store-credentials "DirectMetalNotary" \
                --apple-id "${APPLE_ID}" \
                --team-id "${APPLE_TEAM_ID}" \
                --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
                --keychain "${KEYCHAIN_PATH}"
              echo "notarized=true" >> "${GITHUB_OUTPUT}"
            else
              echo "[Release] Notary secrets incomplete; DMG will be Developer ID signed without notarization."
              echo "notarized=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "[Release] Apple signing secrets not configured; building ad-hoc Hardened Runtime Lite DMG."
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "notarized=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build DirectMetal-Lite.app (with bundled d3d12_x64.dll) & DMG
        env:
          APPLE_SIGN_IDENTITY: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_SIGN_IDENTITY || '-' }}
          APPLE_NOTARY_PROFILE: ${{ steps.signing.outputs.notarized == 'true' && 'DirectMetalNotary' || '' }}
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py tools/*.py

          if [[ "${APPLE_SIGN_IDENTITY}" != "-" ]]; then
            ./scripts/package_app.sh --lite --sign "${APPLE_SIGN_IDENTITY}"
          else
            ./scripts/package_app.sh --lite
          fi

          # Guarantee d3d12_x64.dll is ALWAYS bundled for macOS < 26.4 & UE5 D3D12 placed-resource alignment
          GUARD_DLL="dist/DirectMetal-Lite.app/Contents/Resources/guards/d3d12_x64.dll"
          if [[ ! -s "${GUARD_DLL}" ]]; then
            echo "error: expected bundled ${GUARD_DLL} in DirectMetal-Lite.app" >&2
            exit 1
          fi
          file "${GUARD_DLL}"
          codesign --verify --strict dist/DirectMetal-Lite.app

          DMG_ARGS=(--lite)
          if [[ "${APPLE_SIGN_IDENTITY}" != "-" ]]; then
            DMG_ARGS+=(--sign "${APPLE_SIGN_IDENTITY}")
          fi
          if [[ -n "${APPLE_NOTARY_PROFILE}" ]]; then
            DMG_ARGS+=(--notary-profile "${APPLE_NOTARY_PROFILE}")
          fi
          ./scripts/build_dmg.sh "${DMG_ARGS[@]}"

          (cd dist && shasum -a 256 -c DirectMetal-Lite-macOS-arm64.dmg.sha256)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DirectMetal-Lite-${{ steps.meta.outputs.tag }}-macOS-arm64
          path: |
            dist/DirectMetal-Lite-macOS-arm64.dmg
            dist/DirectMetal-Lite-macOS-arm64.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: |
          DMG_FILE="dist/DirectMetal-Lite-macOS-arm64.dmg"
          SHA_FILE="dist/DirectMetal-Lite-macOS-arm64.dmg.sha256"
          SHA_VAL="$(awk '{print $1}' "${SHA_FILE}")"
          DMG_BYTES="$(stat -f%z "${DMG_FILE}")"
          DMG_MIB="$(python3 -c "print(f'{${DMG_BYTES} / (1024 * 1024):.2f}')")"
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"

          if [[ "${SIGNED}" == "true" && "${NOTARIZED}" == "true" ]]; then
            SIGN_SUMMARY="**Apple Developer ID Signed & Notarized** (Gatekeeper-ready; ticket stapled)"
          elif [[ "${SIGNED}" == "true" ]]; then
            SIGN_SUMMARY="**Apple Developer ID Signed** (Hardened Runtime; notarization secrets not configured)"
          else
            SIGN_SUMMARY="**Ad-Hoc Hardened Runtime Signed (\`--options runtime --sign -\`)** — Apple Developer ID secrets were not configured for this build"
          fi

          cat > "${NOTES_FILE}" <<EOF
          ## DirectMetal ${TAG} (macOS Apple Silicon \`arm64\`)

          - **Commit:** \`${COMMIT_SHA}\`
          - **Installer:** \`DirectMetal-Lite-macOS-arm64.dmg\` (\`${DMG_MIB} MiB\`)
          - **SHA-256:** \`${SHA_VAL}\`
          - **Bundled Guards & Layers:** \`d3d12_x64.dll\` (D3D12 Placed-Resource Alignment Guard) + \`VK_LAYER_DIRECTMETAL_mvk_compat\`
          - **Code Signing Status:** ${SIGN_SUMMARY}

          ### First-Launch Setup
          EOF

          if [[ "${SIGNED}" == "true" && "${NOTARIZED}" == "true" ]]; then
            cat >> "${NOTES_FILE}" <<'EOF'
          Drag `DirectMetal-Lite.app` to `/Applications` and launch directly.
          EOF
          else
            cat >> "${NOTES_FILE}" <<'EOF'
          After dragging `DirectMetal-Lite.app` to `/Applications`, clear macOS quarantine once before first launch:

          ```bash
          xattr -dr com.apple.quarantine "/Applications/DirectMetal-Lite.app"
          ```
          EOF
          fi

          cat >> "${NOTES_FILE}" <<'EOF'

          On first launch, `DirectMetal-Lite.app` downloads and SHA-256 + `codesign` verifies the `MetalSharp-Wine` ARM64EC + FEX + Mullion runtime automatically (or via `DirectMetal runtime install`).
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${DMG_FILE}" "${SHA_FILE}" --clobber
          else
            gh release create "${TAG}" "${DMG_FILE}" "${SHA_FILE}" \
              --title "DirectMetal ${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --target "${GITHUB_SHA}"
          fi

      - name: Clean up ephemeral signing keychain
        if: always() && steps.signing.outputs.keychain_path != ''
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || rm -f "${KEYCHAIN_PATH}"
